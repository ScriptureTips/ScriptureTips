<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <title>Scripture Tips</title>
  <link rel="stylesheet" href="pages.css">
</head>
<body class="popup">
  <header class="brand">
    <img src="icons/icon-48.png" alt="" width="32" height="32">
    <h1>Scripture Tips</h1>
  </header>
  <div class="site">
    <p id="where" class="hint"></p>
    <label class="switch" title="Scripture Tips on this site">
      <input type="checkbox" role="switch" aria-checked="true" id="on" aria-label="Scripture Tips on this site">
      <span class="track" aria-hidden="true"></span>
    </label>
  </div>
  <nav class="cards">
    <a href="tool.html" target="_blank" id="tool" class="card" title="Link generator">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
      <span>Generator</span>
    </a>
    <a href="options.html" target="_blank" id="settings" class="card">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      <span>Settings</span>
    </a>
  </nav>
  <footer class="zoom">
    <span class="zoom-label">Text size</span>
    <span class="zoom-buttons">
      <button type="button" class="quiet icon" id="zoom-out" aria-label="Make the text smaller" title="Make the text smaller">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/><path d="M7 10h6"/></svg>
      </button>
      <output id="zoom-now" for="zoom-out zoom-in" aria-live="polite">100%</output>
      <button type="button" class="quiet icon" id="zoom-in" aria-label="Make the text larger" title="Make the text larger">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/><path d="M7 10h6M10 7v6"/></svg>
      </button>
    </span>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
