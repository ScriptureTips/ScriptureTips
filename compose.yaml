name: scripturetips

services:
  # Development toolbox: Node, pnpm and the test tools. Run commands with ./toolbox.
  toolbox:
    build: infra/docker/toolbox
    image: scripturetips-toolbox:dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    volumes:
      - .:/workspace
      # Source texts live outside git, beside the repo (AGENTS.md, Licensing and sources).
      - ../source-texts:/source-texts
      - pnpm-store:/home/node/.local/share/pnpm/store
    environment:
      # The development database (`./dev up`), and the test server the integration tests
      # create their databases on (testing.md §10). Local-only credentials, not secrets.
      DATABASE_URL: postgres://scripturetips:scripturetips@postgres:5432/scripturetips
      TEST_DATABASE_URL: postgres://scripturetips:scripturetips@postgres-test:5432/postgres
      # The test file store (packages/storage), set up by the tests' global setup.
      TEST_GARAGE_ADMIN_URL: http://garage-test:3903
      TEST_GARAGE_ADMIN_TOKEN: development-only-garage-admin-token
      TEST_STORAGE_ENDPOINT: http://garage-test:3900
      TEST_STORAGE_ACCESS_KEY: &storage-key GKb2e75133b9874f5cb7b7cf92
      TEST_STORAGE_SECRET_KEY: &storage-secret 85d4c95d964ccd37bdb8d4e2de648db19b390cc768945fc1c77f126471578445
      TEST_STORAGE_BUCKET: scripturetips-test
    depends_on:
      postgres-test:
        condition: service_healthy
      garage-test:
        condition: service_healthy
    profiles: [tools]

  # Development database, started with ./dev up. Its data is kept in the pgdata volume.
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: scripturetips
      POSTGRES_PASSWORD: scripturetips
      POSTGRES_DB: scripturetips
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -U, scripturetips]
      interval: 2s
      retries: 30
    profiles: [dev]

  # The API (apps/api) in the app role, rebuilt and restarted on every change, behind the web
  # app. Also at http://127.0.0.1:3001/api on this machine.
  api:
    image: scripturetips-toolbox:dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    command: [pnpm, --filter, "@scripturetips/api", dev]
    # `./dev up` waits until the API answers.
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/api/translations').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 2s
      retries: 60
    volumes:
      - .:/workspace
    environment:
      DATABASE_URL: postgres://scripturetips:scripturetips@postgres:5432/scripturetips
      PORT: "3001"
      # Accounts (apps/api/src/auth). A development-only secret: production sets its own.
      AUTH_SECRET: development-only-secret-not-for-production-use
      AUTH_URL: https://dev.scripturetips.com
      TRUSTED_ORIGINS: https://dev.scripturetips.com
      VALKEY_URL: redis://valkey:6379
      # `ACCOUNTS=closed ./dev up --lan` runs the reader only, as the first release does.
      ACCOUNTS: ${ACCOUNTS:-open}
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: ScriptureTips <no-reply@scripturetips.localhost>
      <<: &storage
        STORAGE_ENDPOINT: http://garage:3900
        STORAGE_ACCESS_KEY: *storage-key
        STORAGE_SECRET_KEY: *storage-secret
        STORAGE_BUCKET: scripturetips
    ports:
      - 127.0.0.1:3001:3001
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      mailpit:
        condition: service_started
      garage-init:
        condition: service_completed_successfully
    profiles: [dev]

  # The API in the data role (vision §7.2), the data server at https://dev.scripture.tips. It
  # runs the build the `api` service keeps up to date, restarting when it changes.
  api-data:
    image: scripturetips-toolbox:dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace/apps/api
    command: [node, --watch, dist/main.js]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/api/widget/translations').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 2s
      retries: 60
    volumes:
      - .:/workspace
    environment:
      DATABASE_URL: postgres://scripturetips:scripturetips@postgres:5432/scripturetips
      PORT: "3001"
      API_ROLE: data
    depends_on:
      api:
        condition: service_healthy
    profiles: [dev]

  # Builds PDFs (apps/pdf-worker, book-designer.md §9): Typst and the fonts in an image of its
  # own, taking jobs from Valkey. Runs the workspace's code, restarted on every change.
  pdf-worker:
    build: infra/docker/pdf-worker
    image: scripturetips-pdf-worker:dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    command: [node, --watch, apps/pdf-worker/src/main.ts]
    volumes:
      - .:/workspace
    environment:
      VALKEY_URL: redis://valkey:6379
      <<: *storage
    depends_on:
      valkey:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    profiles: [dev]

  # The file store (vision §7): Garage, S3-compatible. Holds each PDF build's files.
  garage:
    image: dxflrs/garage:v2.4.1
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage:/var/lib/garage
    environment: &garage-secrets # Development-only secrets: production sets its own.
      GARAGE_RPC_SECRET: 483d6e7676f649fcc7ca9cbbd7cc4af430b259aec4543e0612c3b3ae4f57652a
      GARAGE_ADMIN_TOKEN: development-only-garage-admin-token
    healthcheck:
      test: [CMD, /garage, status]
      interval: 2s
      retries: 30
    profiles: [dev]

  # Sets up the development store once Garage is up: node role, access key and bucket.
  garage-init:
    image: scripturetips-toolbox:dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    command: [node, infra/garage/init.ts]
    volumes:
      - .:/workspace
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: development-only-garage-admin-token
      <<: *storage
    depends_on:
      garage:
        condition: service_healthy
    profiles: [dev]

  # Rate limits and bot-check replay protection (later also BullMQ jobs). Nothing in it needs
  # keeping, so it has no volume.
  valkey:
    image: valkey/valkey:9.0.7-alpine
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 2s
      retries: 30
    profiles: [dev]

  # Catches every email the stack sends, such as sign-in codes: read them at
  # http://127.0.0.1:8025, or on the local network with `./dev up --lan` (it has no sign-in, so
  # anyone on the network can read them then). Nothing leaves the machine.
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - ${LAN_BIND:-127.0.0.1}:8025:8025
    profiles: [dev]

  # The web app (apps/web), with hot reload, at https://dev.scripturetips.com through Caddy.
  web:
    image: scripturetips-toolbox:dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    command: [pnpm, --filter, "@scripturetips/web", dev]
    # `./dev up` waits until the web app serves its first page.
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 2s
      timeout: 30s
      retries: 60
    volumes:
      - .:/workspace
    environment:
      API_URL: http://api:3001/api
      NEXT_TELEMETRY_DISABLED: "1"
      ACCOUNTS: ${ACCOUNTS:-open}
      CONTACT_EMAIL: help@scripturetips.localhost
      # The site name the browser uses, for the dev server's own requests (hot reload).
      DEV_ORIGINS: dev.scripturetips.com
    depends_on:
      - api
    profiles: [dev]

  # The reverse proxy (infra/caddy/Caddyfile), as in production: https://dev.scripturetips.com
  # (the web app) and https://dev.scripture.tips (the data server: its API, and the site's pages). Their public DNS records point
  # at this machine's network address, which `./dev up --lan` listens on. Plain `./dev up` listens
  # on 127.0.0.1 only, reached through a hosts-file entry for both names. Inside the stack the
  # names are aliases of this container, so the end-to-end tests reach it by name too.
  caddy:
    # Caddy with the acme-dns plugin, for trusted certificates (infra/caddy/README.md).
    build: infra/docker/caddy
    image: scripturetips-caddy:dev
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The scripture.tips site (apps/site): its serving rules, and the files `./dev up` builds.
      - ./apps/site/site.caddy:/etc/caddy/site.caddy:ro
      - ./apps/site/dist:/srv/site:ro
      # Pages for trying the browser extension (dev.scripture.tips/demo): the dev stack only.
      - ./apps/extension/demo:/srv/demo:ro
      # `./dev` sets DEV_TLS to acme-dns once .dev-certs/acme-dns.json exists.
      - ./infra/caddy/tls-${DEV_TLS:-self-signed}.caddy:/etc/caddy/tls.caddy:ro
      - ./.dev-certs:/certs:ro
      # Its certificates and ACME account, kept so restarts don't ask Let's Encrypt again.
      - caddy-data:/data
    ports:
      - ${LAN_BIND:-127.0.0.1}:80:80
      - ${LAN_BIND:-127.0.0.1}:443:443
    networks:
      default:
        aliases: [dev.scripturetips.com, dev.scripture.tips]
    depends_on:
      web:
        condition: service_healthy
      api-data:
        condition: service_healthy
    profiles: [dev]

  # Integration-test server (testing.md §10): separate from development data, held in memory,
  # started with the toolbox. Each test file gets its own database, cloned from a migrated
  # template.
  postgres-test:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: scripturetips
      POSTGRES_PASSWORD: scripturetips
    command: [postgres, -c, fsync=off, -c, synchronous_commit=off, -c, full_page_writes=off]
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -U, scripturetips]
      interval: 1s
      retries: 30
    profiles: [tools, test]

  # Integration-test file store, held in memory, started with the toolbox. The tests' global
  # setup gives it its access key and bucket (packages/storage).
  garage-test:
    image: dxflrs/garage:v2.4.1
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
    tmpfs:
      - /var/lib/garage
    environment: *garage-secrets
    healthcheck:
      test: [CMD, /garage, status]
      interval: 1s
      retries: 30
    profiles: [tools, test]

volumes:
  caddy-data:
  pnpm-store:
  pgdata:
  garage:
